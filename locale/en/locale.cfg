[mod-name]
inserter-throughput=Inserter Throughput

[mod-description]
inserter-throughput=Displays inserter throughput information.

[custom-tooltip-fields]
throughput-name=Base Throughput
throughput-value=__1__ items/s

[runtime-tooltip-fields]
throughput-name=Throughput
throughput-value=__1__ items/s

[mod-setting-name]
show-base-throughput=Show Base Throughput

[mod-setting-description]
show-base-throughput=Whether to show the base throughput of the inserter in the tooltip. The base throughput is the maximum throughput of the inserter without any bonuses or penalties applied. The players inventory/crafting menu can only display this value as it is set during the data loading phase (startup).